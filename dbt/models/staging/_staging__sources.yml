version: 2

sources:
  - name: raw
    description: >
      Raw scraped SEEK Australia job listings (PromptCloud "Latest Seek Australia
      Job Dataset" via Kaggle). Static historical snapshot, Aug-Oct 2019, ~10k
      listings. Read directly off the local JSON-lines file via DuckDB's JSON
      reader -- no separate load/seed step needed.
    tables:
      - name: seek_job_listings
        description: One row per scraped job ad, as published to seek.com.au.
        config:
          external_location: "read_json_auto('../data/raw/seek_job_listings.jsonl', ignore_errors=true)"
          formatter: oldstyle
